name: Le saviez-vous ? Bizhakesef

# Chaque dimanche vers 8 h 30 (heure d'Israël), pour le rendez-vous du lundi 7 h 30 : une proposition arrive sur Telegram, à valider comme un article.
on:
  schedule:
    - cron: "30 6 * * 0"
  workflow_dispatch:
  repository_dispatch:
    types: [saviez_vous]

jobs:
  saviez:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
      CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
      CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
      CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
      MAKE_HOOK_URL: ${{ secrets.MAKE_HOOK_URL }}
      ADMIN_CHAT_ID: ${{ secrets.ADMIN_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Choisir un sujet et rédiger le carrousel
        run: python saviez_vous.py
      - name: Signaler un échec
        if: failure()
        run: python -c "import notify; notify.tell_make('SAVOIRERR|x|Le « Saviez-vous ? » du jour n a pas pu être préparé (GitHub Actions, run ${{ github.run_id }}).')"
