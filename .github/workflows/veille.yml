name: Veille Bizhakesef

# Veille quotidienne (remplace la veille faite dans Make, pour économiser les crédits Make).
# Déclenchée à l'heure exacte par les scénarios Make « veille » (un seul appel, 1 crédit) : le cron de GitHub
# part avec des heures de retard. Semaine : dimanche à vendredi, 8 h ; motsaé Shabbat : samedi, 21 h.
on:
  repository_dispatch:
    types: [veille]

jobs:
  veille:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      ADMIN_CHAT_ID: ${{ secrets.ADMIN_CHAT_ID }}
      CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
      CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
      CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - name: Veille à la demande
        if: github.event_name == 'repository_dispatch'
        run: python veille.py ${{ github.event.client_payload.edition || 'semaine' }}
      - name: Alerte en cas d'échec
        if: failure()
        run: |
          curl -s "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" -d chat_id="${ADMIN_CHAT_ID}" \
            --data-urlencode text="❌ La veille du jour a échoué (GitHub Actions). Envoie-moi directement un lien d'article."
