name: Story Shabbat Bizhakesef

# Chaque vendredi à 9 h (heure d'Israël) : story des horaires de Shabbat (Jérusalem, Tel-Aviv, Paris) et de la paracha.
# Le cron est en UTC : deux déclenchements (6 h et 7 h UTC), le script ne publie que celui qui tombe à 9 h en Israël.
on:
  schedule:
    - cron: "0 6,7 * * 5"
  repository_dispatch:
    types: [shabbat_apercu]

jobs:
  shabbat:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
      CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
      CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      ADMIN_CHAT_ID: ${{ secrets.ADMIN_CHAT_ID }}
      PW_CHANNEL: chrome
    steps:
      - uses: actions/checkout@v4
      - name: Installer Playwright (Chrome est déjà présent sur la machine)
        run: pip install -q playwright
      - name: Aperçu sur Telegram (sans publication)
        if: github.event_name == 'repository_dispatch'
        run: python shabbat_story.py --apercu
      - name: Publier la story
        if: github.event_name == 'schedule'
        env:
          GARDE_9H: "1"
        run: python shabbat_story.py
