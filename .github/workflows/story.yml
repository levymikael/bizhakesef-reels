name: Story d'un reel Bizhakesef

# Make déclenche ce workflow juste après la publication d'un reel : la vidéo est republiée en story.
on:
  repository_dispatch:
    types: [story]

jobs:
  story:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      ADMIN_CHAT_ID: ${{ secrets.ADMIN_CHAT_ID }}
      JOB: ${{ toJSON(github.event.client_payload) }}
    steps:
      - uses: actions/checkout@v4
      - name: Publier la story
        run: python story.py
