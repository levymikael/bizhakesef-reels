name: Stats Instagram Bizhakesef

# Relevé des statistiques (compte, audience, posts) directement dans l'API Instagram, sans service tiers.
on:
  repository_dispatch:
    types: [stats]
  workflow_dispatch:

jobs:
  stats:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      ADMIN_CHAT_ID: ${{ secrets.ADMIN_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Relever les statistiques
        run: python stats.py
