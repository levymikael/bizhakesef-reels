name: Actualisation d'un reel Bizhakesef avant publication

# Déclenché par les scénarios Make « préparation » ~25 minutes avant un créneau (repository_dispatch, type « refresh_reel »)
on:
  repository_dispatch:
    types: [refresh_reel]

concurrency:
  group: reels
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
      CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
      CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
      CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
      MAKE_HOOK_URL: ${{ secrets.MAKE_HOOK_URL }}
      ADMIN_CHAT_ID: ${{ secrets.ADMIN_CHAT_ID }}
      JOB_ID: ${{ github.event.client_payload.id }}
      PW_CHANNEL: chrome
    steps:
      - uses: actions/checkout@v4
      - name: Installer FFmpeg et Playwright
        run: |
          pip install -q playwright imageio-ffmpeg
          echo "FFMPEG=$(python -c 'import imageio_ffmpeg as i; print(i.get_ffmpeg_exe())')" >> "$GITHUB_ENV"
      - name: Préparer la commande
        env:
          PAYLOAD: ${{ toJSON(github.event.client_payload) }}
        run: printf '%s' "$PAYLOAD" > job.json
      - name: Relever le cours, mettre à jour la légende et remonter le reel
        run: python refresh_reel.py job.json
      - name: Signaler un échec
        if: failure()
        run: python -c "import notify; notify.tell_make('MAJERR|$JOB_ID|actualisation impossible (voir GitHub Actions, run ${{ github.run_id }})')"
